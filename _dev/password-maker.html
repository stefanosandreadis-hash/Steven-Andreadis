<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Password maker (do not upload)</title>
<style>body{font:16px Georgia,serif;max-width:640px;margin:60px auto;padding:0 20px;line-height:1.5}
input{font:inherit;width:100%;padding:8px;margin:8px 0 16px}textarea{width:100%;height:90px;font:13px monospace}</style></head>
<body>
<h2>Password maker</h2>
<p>Type your new password. Use a long one (4 random words). Copy the two lines below into <b>js/script.js</b> (replace the old SALT and HASH lines).</p>
<input id="p" type="text" placeholder="new password" autocomplete="off">
<textarea id="out" readonly></textarea>
<p><small>Local tool: keep it out of the folder you upload.</small></p>
<script>
const SALT='sa-portfolio:', ITER=100000;
document.getElementById('p').addEventListener('input', async e => {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(e.target.value), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits({name:'PBKDF2', salt:new TextEncoder().encode(SALT), iterations:ITER, hash:'SHA-256'}, base, 256);
  const hex=[...new Uint8Array(bits)].map(b=>b.toString(16).padStart(2,'0')).join('');
  document.getElementById('out').value = "const SALT = '"+SALT+"';\nconst HASH = '"+hex+"';";
});
</script></body></html>
